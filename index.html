<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="style.css/global.css" />
    <link rel="stylesheet" href="style.css/fonts.css" />

    <title>
      Frontend Mentor | Newsletter sign-up form with success message
    </title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main>
      <article class="newsletter-container">
        <picture>
          <source
            media="(max-width: 375px)"
            srcset="./assets/images/illustration-sign-up-mobile.svg"
          />
          <source
            media="(min-width: 376px) and (max-width: 1439px)"
            srcset="assets/images/illustration-sign-up-tablet.svg"
          />
          <source
            media="(min-width: 1440px)"
            srcset="assets/images/illustration-sign-up-desktop.svg"
          />
          <img src="./assets/images/illustration-sign-up-mobile.svg" alt="" />
        </picture>
        <section class="newsletter__description">
          <h1>Stay updated!</h1>
          <p>Join 60,000+ product managers receiving monthly updates on:</p>
          <ul>
            <li>Product discovery and building what matters</li>
            <li>Measuring to ensure updates are a success</li>
            <li>And much more!</li>
          </ul>
        </section>
        <section class="newsletter__form-inputs">
          <form action="">
            <div class="newsletter__email-input-container">
              <label for="email"></label>
                Email Address<input
                  type="email"
                  id="email"
                  placeholder="email@company.com"
              /></label>
            </div>
            <button type="button">Subscribe to monthly newsletter</button>
          </form>
        </section>
      </article>
    </main>

    <!-- Success message start -->

    <!-- Thanks for subscribing! A confirmation email has been sent to
    ash@loremcompany.com. Please open it and click the button inside to confirm
    your subscription. Dismiss message -->

    <!-- Success message end -->
  </body>
</html>
